    <!-- Basket Body Base -->
    <path d="M 98 252 L 130 430 C 134 452, 152 468, 174 468 L 338 468 C 360 468, 378 452, 382 430 L 414 252 Z"/>
    <!-- Slats Cutouts for Grocery Crate Effect -->

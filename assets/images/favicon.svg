      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#freshGrad)"/>
  
  <!-- Grocery Basket / Produce Box in Pure White -->
  <g fill="#ffffff">

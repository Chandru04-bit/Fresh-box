<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Deliveries - FreshBox</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-header d-flex align-items-center justify-content-between">
        <a class="navbar-brand mb-0" href="../index.html">
          <div class="brand-icon"><i class="bi bi-basket2-fill"></i></div>
          <span>Fresh</span>Box
        </a>
      </div>

      <ul class="sidebar-menu">
        <li class="menu-category">Subscriber Portal</li>
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="subscription.html"><i class="bi bi-card-checklist"></i> My Subscription</a></li>
        <li class="nav-item"><a class="nav-link" href="my-box.html"><i class="bi bi-box-seam-fill"></i> My Box</a></li>
        <li class="nav-item"><a class="nav-link active" href="deliveries.html"><i class="bi bi-truck"></i> Upcoming Deliveries</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html"><i class="bi bi-clock-history"></i> Order History</a></li>
        <li class="nav-item"><a class="nav-link" href="billing.html"><i class="bi bi-receipt"></i> Billing & Invoices</a></li>
        <li class="menu-category">Account</li>
        <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person-gear"></i> Saved Addresses & Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a></li>
      </ul>

      <div class="sidebar-footer">
        <a href="../index.html" class="nav-link text-danger d-flex align-items-center gap-2" onclick="freshboxApp.setAuth({ role: 'guest' });">
          <i class="bi bi-power fs-5"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-5"></i></button>
          <div>
            <h5 class="fw-bold mb-0">Upcoming Deliveries</h5>
            <small class="text-muted">Track upcoming shipments or skip weeks</small>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button class="nav-action-btn theme-toggle-btn" type="button" title="Theme"><i class="bi bi-moon-stars-fill"></i></button>
          <button class="nav-action-btn rtl-toggle-btn" type="button" title="RTL Mode" aria-label="RTL Mode"><i class="bi bi-arrow-left-right"></i></button>
          <div class="dropdown nav-user-dropdown ms-1">
            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
              <span class="nav-user-avatar"><i class="bi bi-person-fill"></i></span>
              <span class="nav-user-name d-none d-sm-inline" id="dashboardUserName">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
              <li>
                <a class="dropdown-item" href="index.html">
                  <i class="bi bi-grid-fill text-success"></i>
                  <span>User Dashboard</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item text-danger" href="../login.html" onclick="freshboxApp.setAuth({ role: 'guest' });">
                  <i class="bi bi-power"></i>
                  <span>Logout</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </header>

      <div class="dashboard-content">
        <!-- Delivery Schedule Timeline Cards -->
        <div class="row g-4" id="upcomingDeliveriesContainer">
          <!-- Populated dynamically based on user's real subscription / active orders -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>

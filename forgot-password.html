<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Forgot Password - Reset your FreshBox subscriber account credentials.">
  <title>Reset Password - FreshBox</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .auth-utility-header { background: rgba(241, 248, 242, .92); border-bottom: 1px solid rgba(46, 125, 50, .14); box-shadow: 0 2px 10px rgba(23, 67, 36, .04); }
    .auth-utility-header .container { min-height: 64px; gap: .75rem; }
    .auth-header-actions { gap: .6rem; }
    .auth-utility-header .nav-action-btn { width: 36px; height: 36px; border-radius: .55rem; background: rgba(255, 255, 255, .78); font-size: 1rem; }
    .auth-back-link { display: inline-flex; align-items: center; gap: .42rem; color: #456150; font: 600 .88rem/1 "Plus Jakarta Sans", sans-serif; text-decoration: none; white-space: nowrap; transition: color .2s ease, transform .2s ease; }
    .auth-back-link:hover { color: var(--primary); transform: translateX(-2px); }
    [dir="rtl"] .auth-back-link:hover { transform: translateX(2px); }
    [data-bs-theme="dark"] .auth-utility-header { background: rgba(19, 31, 23, .96); border-color: #2e4434; box-shadow: 0 2px 12px rgba(0, 0, 0, .22); }
    [data-bs-theme="dark"] .auth-utility-header .nav-action-btn { background: #1a2820; border-color: #38503e; color: #e4eee5; }
    [data-bs-theme="dark"] .auth-back-link { color: #b5cbb9; }
    [data-bs-theme="dark"] .auth-back-link:hover { color: #81c784; }
    @media (max-width: 575.98px) { .auth-utility-header { padding-block: .55rem !important; } .auth-utility-header .container { min-height: auto; } .auth-utility-header .navbar-brand { font-size: 1.3rem; } .auth-utility-header .brand-icon { width: 36px; height: 36px; font-size: 1.1rem; } .auth-header-actions { width: 100%; justify-content: flex-end; gap: .45rem; } .auth-utility-header .nav-home-btn { padding: 6px 10px !important; } .auth-back-link { font-size: .8rem; } }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <header class="auth-utility-header py-2">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="bi bi-basket2-fill"></i></div>
        <span>Fresh</span>Box
      </a>
      <div class="auth-header-actions d-flex flex-wrap align-items-center justify-content-end">
        <button class="nav-action-btn theme-toggle-btn" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle dark mode"><i class="bi bi-moon-stars-fill"></i></button>
        <button class="nav-action-btn rtl-toggle-btn" type="button" title="RTL Mode" aria-label="RTL Mode"><i class="bi bi-arrow-left-right"></i></button>
        <a href="login.html" class="auth-back-link"><i class="bi bi-arrow-left"></i> Back to Login</a>
      </div>
    </div>
  </header>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="fresh-card p-4 p-md-5 text-center">
            <div class="feature-icon-bubble bg-primary-subtle text-primary mx-auto mb-3">
              <i class="bi bi-key-fill fs-3"></i>
            </div>
            <h3 class="fw-bold mb-2">Forgot Password?</h3>
            <p class="text-muted small mb-4">Enter your registered email address and we'll send you an instant reset link.</p>

            <form onsubmit="event.preventDefault(); document.getElementById('resetSuccessMsg').classList.remove('d-none'); freshboxApp.showToast('Link Sent!', 'Password reset link sent to your inbox.', 'success');">
              <div class="mb-3 text-start">
                <label class="form-label">Registered Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>
              </div>

              <div id="resetSuccessMsg" class="alert alert-success d-none text-start small py-2">
                <i class="bi bi-check-circle-fill me-1"></i> Reset instructions dispatched! Check your spam folder if not received in 2 minutes.
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                Send Reset Link
              </button>

              <a href="login.html" class="text-muted small text-decoration-none">&larr; Return to Sign In</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

    <!-- Global Footer -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
